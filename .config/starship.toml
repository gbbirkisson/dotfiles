"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$kubernetes\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$custom\
$git_status\
$cmd_duration\
$java\
$python\
$terraform\
$nodejs\
$zig\
$golang\
$rust\
$battery\
$status\
$shell\
$line_break\
$character"""

# $package\
#$line_break\
[directory]
style = "bold blue"

[python]
style = "green bold"
# Only trigger when venv is activated
detect_extensions = []
detect_files = []

[terraform]
format = 'via [$symbol$version]($style) '
detect_files = ["atlantis.yaml"]

[status]
symbol = '💩'
format = '[$symbol \[$int\]]($style) '
disabled = false

[git_branch]
style = "bold yellow"

[git_status]
style = "bold fg:red"

[character]
format = "$symbol"
success_symbol = "[\\$](bold green) "
error_symbol = "[\\$](bold red) "

[kubernetes]
symbol = '☸  '
style = "bold #c678dd"
disabled = false

[[kubernetes.contexts]]
context_pattern = "gke_.*_(?P<cluster>[\\w-]+)"
context_alias = "gke-$cluster"

[cmd_duration]
disabled = false
min_time = 2000
format = "took [$duration]($style) "

# Run in home folder
[custom.todo]
shell = ["sh"]
when = '''cat .TODO.md TODO.md 2>/dev/null | rg -q "\[\s*\]"'''
style = "bold #d19a66"
format = '$symbol[\[TODO\] ]($style)'

---
- hosts: "{{ host }}"

  tasks:
    # - name: Install dependencies
    #   become: true
    #   apt:
    #     state: latest
    #     update_cache: true
    #     pkg:
    #       # General dependencies
    #       - libssl-dev

    - name: Install cargo packages
      when: 'item.crate_name not in skip_cargo'
      community.general.cargo:
        name: "{{ item.crate_name }}"
        version: "{{ item.version }}"
        locked: "{{ item.locked }}"
      with_items:
        - { crate_name: cargo-upgrades, version: 3.1.0, locked: true }    # For cargo dependencies
        - { crate_name: loc, version: 0.5.0, locked: true }               # Count loc
        - { crate_name: satty, version: 0.22.0, locked: true }            # Screenshot annotation

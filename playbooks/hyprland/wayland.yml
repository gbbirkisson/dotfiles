---
- hosts: "{{ host }}"

  # Only wayland-scanner is built here. wayland-protocols >= 1.49 uses XML
  # attributes (interface "frozen") that Debian's wayland-scanner 1.23 rejects.
  # libwayland itself is left to Debian (-Dlibraries=false).

  vars:
    # renovate: datasource=git-tags depName=wayland packageName=https://gitlab.freedesktop.org/wayland/wayland.git
    version: "1.26.0"
    dir: "/tmp/wayland"

  tasks:
    - name: Check if skip
      meta: end_play
      when: '"hyprland" in skip'

    - name: Checkout wayland
      ansible.builtin.git:
        repo: https://gitlab.freedesktop.org/wayland/wayland.git
        dest: "{{ dir }}"
        version: "{{ version }}"
        force: true

    - name: Build wayland-scanner
      shell:
        chdir: "{{ dir }}"
        cmd: |
          meson setup build --prefix=/usr/local -Dlibraries=false -Dtests=false -Ddocumentation=false
          ninja -C build

    - name: Install wayland-scanner to /usr/local
      become: true
      shell:
        chdir: "{{ dir }}"
        cmd: |
          ninja -C build install
